<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img"><title>Jewelry configurator — material, sizing and engraving</title><desc>Interface recreation with illustrative content and sample data.</desc><rect width="960" height="640" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="66" rx="0" fill="#fff" stroke="none"/><text x="32" y="41" font-size="24" fill="#635747" font-weight="600" font-family="Georgia, serif">Personal collection</text><text x="532" y="39" font-size="13" fill="#76808b" font-weight="400" >Collection</text><text x="637" y="39" font-size="13" fill="#76808b" font-weight="400" >Our story</text><text x="738" y="39" font-size="13" fill="#76808b" font-weight="400" >Search</text><text x="838" y="39" font-size="13" fill="#635747" font-weight="400" >Bag (2)</text><path d="M0 66L960 66" stroke="#e5e8eb" stroke-width="1" fill="none"/><text x="36" y="104" font-size="12" fill="#76808b" font-weight="400" >Collection  /  Rings  /  Personalise</text><rect x="30" y="130" width="448" height="426" rx="2" fill="#eee9e2" stroke="none"/><circle cx="253" cy="341" r="151" fill="#e8e1d7" stroke="none"/><g transform="translate(153 215) scale(1)"><ellipse cx="100" cy="100" rx="71" ry="93" fill="none" stroke="#b69452" stroke-width="14"/><ellipse cx="98" cy="99" rx="66" ry="89" fill="none" stroke="#e1cd94" stroke-width="5"/><path d="M70 13L86 0H112L130 13 100 48Z" fill="#fafafa" stroke="#b1b8b8" stroke-width="2"/><path d="M70 13H130M86 0L88 13 100 48 112 13 112 0" fill="none" stroke="#c0c8ca"/></g><text x="254" y="525" font-size="17" fill="#897b6b" font-weight="400" font-family="Georgia, serif" text-anchor="middle">Made personal. Made to keep.</text><text x="514" y="156" font-size="11" fill="#968270" font-weight="600" letter-spacing="2">THE PERSONAL COLLECTION</text><text x="514" y="197" font-size="31" fill="#443d36" font-weight="400" font-family="Georgia, serif">A ring, uniquely yours.</text><text x="514" y="230" font-size="14" fill="#76808b" font-weight="400" >Choose your finish and add a personal detail.</text><text x="514" y="273" font-size="14" fill="#27313b" font-weight="600" >01   Choose your material</text><circle cx="531" cy="305" r="15" fill="#c5a368" stroke="none"/><circle cx="531" cy="305" r="20" fill="none" stroke="#7d6c51"/><circle cx="580" cy="305" r="15" fill="#c1c5ca" stroke="none"/><circle cx="629" cy="305" r="15" fill="#ca9c86" stroke="none"/><text x="685" y="310" font-size="14" fill="#776b59" font-weight="400" >Yellow gold</text><text x="514" y="361" font-size="13" fill="#76808b" font-weight="400" >02   Ring size</text><rect x="514" y="373" width="174" height="42" rx="4" fill="#fff" stroke="#d9dce0"/><text x="527" y="400" font-size="15" fill="#27313b" font-weight="400" >Size 7     ⌄</text><text x="706" y="361" font-size="13" fill="#76808b" font-weight="400" >03   Engraving</text><rect x="706" y="373" width="216" height="42" rx="4" fill="#fff" stroke="#d9dce0"/><text x="719" y="400" font-size="15" fill="#27313b" font-weight="400" >Always, together</text><text x="514" y="442" font-size="12" fill="#76808b" font-weight="400" >Your engraving appears inside the band.</text><path d="M514 462L922 462" stroke="#e5e8eb" stroke-width="1" fill="none"/><text x="514" y="493" font-size="13" fill="#76808b" font-weight="400" >Your selection</text><text x="922" y="493" font-size="20" fill="#27313b" font-weight="600" text-anchor="end">$240.00</text><rect x="514" y="517" width="408" height="42" rx="5" fill="#6f6557" stroke="none"/><text x="718" y="544" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Add personalised ring to bag</text></g></svg>
